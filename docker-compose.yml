version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPERATOR_SIGNER_PRIVATE_KEY=${OPERATOR_SIGNER_PRIVATE_KEY}
      - NEXT_PUBLIC_OPERATOR_SIGNER_ADDRESS=${NEXT_PUBLIC_OPERATOR_SIGNER_ADDRESS}
      - NEXT_PUBLIC_BASE_VAULT_ADDRESS=${NEXT_PUBLIC_BASE_VAULT_ADDRESS}
      - NEXT_PUBLIC_ARB_VAULT_ADDRESS=${NEXT_PUBLIC_ARB_VAULT_ADDRESS}
    networks:
      - internal_mesh

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - internal_mesh
    ports:
      - "8080:80"

  tor:
    image: alpine:latest
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache tor &&
             chown -R tor /var/lib/tor &&
             tor -f /etc/tor/torrc"
    volumes:
      - ./docker/tor/torrc:/etc/tor/torrc:ro
      - tor_keys:/var/lib/tor/cypherroll_onion/
    depends_on:
      - nginx
    networks:
      - internal_mesh

networks:
  internal_mesh:
    driver: bridge

volumes:
  tor_keys:
    driver: local
